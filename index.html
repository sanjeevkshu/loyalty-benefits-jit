<!DOCTYPE html>
<html lang="en" class="light" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Aura Platinum Financial & Benefits Catalog - Exclusive World Elite privileges, private wealth management, and premier channel partner experiences for Sarah Jenkins.">
    <meta name="keywords" content="Aura Platinum, World Elite Credit Card, Private Banking, Luxury Travel, VIP Lounge, Chauffeur, Hotel Upgrades, Concierge">
    <meta name="author" content="Aura Platinum Financial Services">
    <title>Aura Platinum | Private Financial & Benefits Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <header role="banner" class="fixed top-0 left-0 right-0 z-40 bg-white/90 dark:bg-[#090d16]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="w-full px-6 lg:px-12 h-20 flex items-center justify-between">
            
            <!-- Icon-Only Quick Navigation Logo CTA -->
            <button onclick="handleLogoClick()" class="w-11 h-11 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-aura-500 transition-all flex items-center justify-center bg-aura-500 text-white shadow-lg shadow-aura-500/30 focus:outline-none focus:ring-2 focus:ring-aura-500" aria-label="Aura Platinum Portal Home" id="nav-logo-btn">
                <i class="fa-solid fa-crown text-base" aria-hidden="true" id="nav-logo-icon"></i>
            </button>

            <!-- Right Actions: Icon-Only Status & Theme Toggle -->
            <div class="flex items-center space-x-3">
                <div id="auth-header-btn-container">
                    <button onclick="openLoginModal()" class="w-11 h-11 rounded-xl bg-aura-500 text-white flex items-center justify-center hover:bg-aura-600 transition-colors shadow-lg shadow-aura-500/20 focus:ring-2 focus:ring-aura-500" aria-label="Sign In">
                        <i class="fa-solid fa-right-to-bracket text-base" aria-hidden="true"></i>
                    </button>
                </div>
                <button onclick="toggleTheme()" class="w-11 h-11 rounded-xl border border-slate-300 dark:border-slate-700 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus:ring-2 focus:ring-aura-500" aria-label="Toggle Theme" title="Toggle Theme">
                    <i class="fa-solid fa-moon text-slate-700 dark:text-amber-300 text-lg" aria-hidden="true" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </header>

    <main role="main" class="flex-grow pt-20" id="main-container">
        <!-- Rendered dynamically by state -->
    </main>

    <!-- PROVIDER LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="card-box rounded-3xl max-w-md w-full p-8 shadow-2xl relative transform scale-95 transition-transform duration-200" id="login-modal-content">
            
            <button onclick="closeLoginModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 dark:hover:text-white w-9 h-9 rounded-full border border-slate-300 dark:border-slate-700 flex items-center justify-center" aria-label="Close Login Modal">
                <i class="fa-solid fa-xmark text-base" aria-hidden="true"></i>
            </button>

            <div class="text-center mb-8">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-xl shadow-blue-500/30 mb-4">
                    <i class="fa-solid fa-shield-halved text-xl" aria-hidden="true"></i>
                </div>
                <h3 id="modal-title" class="text-2xl font-extrabold">Provider Login</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-1">Simulate Authentication for Sarah Jenkins</p>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label for="client-id-input" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Client ID / Email</label>
                    <input id="client-id-input" type="text" required value="sarah.jenkins@auraplatinum.com" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-aura-500 text-sm font-medium">
                </div>
                <div>
                    <label for="token-pin-input" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">Secure Token PIN</label>
                    <input id="token-pin-input" type="password" required value="••••••••••••" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-aura-500 text-sm font-medium">
                </div>
                <button type="submit" class="w-full py-4 rounded-xl bg-aura-500 text-white font-bold text-sm shadow-xl shadow-aura-500/30 hover:bg-aura-600 transition-colors">
                    Authenticate & Enter
                </button>
            </form>
        </div>
    </div>

    <!-- NON-INTRUSIVE PUSH NOTIFICATION CONTAINER -->
    <div id="push-notification-container" class="fixed top-24 right-6 z-50 space-y-3 pointer-events-none max-w-sm w-full"></div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 card-box rounded-2xl p-4 shadow-2xl flex items-center space-x-3 max-w-sm pointer-events-auto" role="status" aria-live="polite">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white flex-shrink-0 shadow-lg shadow-emerald-500/30">
            <i class="fa-solid fa-circle-check text-base" aria-hidden="true"></i>
        </div>
        <div>
            <h5 class="text-xs font-bold" id="toast-title">Success</h5>
            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-0.5" id="toast-msg">Completed.</p>
        </div>
    </div>

    <!-- Minimal Footer -->
    <footer role="contentinfo" class="w-full py-8 border-t border-slate-200 dark:border-slate-800 text-xs font-medium text-slate-500 dark:text-slate-400 text-center bg-white dark:bg-[#090d16]">
        <div class="w-full px-6 lg:px-12 max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 Aura Platinum Financial. All rights reserved.</p>
            <div class="flex items-center space-x-6">
                <a href="#" onclick="showToast('Privacy Policy', 'Aura Platinum complies with strict banking confidentiality standards.'); return false;" class="hover:text-aura-500 transition-colors">Privacy</a>
                <a href="#" onclick="showToast('Terms of Service', 'World Elite Member Agreement governs all catalog redemptions.'); return false;" class="hover:text-aura-500 transition-colors">Terms</a>
                <a href="#" onclick="showToast('Concierge Direct', '24/7 VIP Line: +1 (800) 555-AURA'); return false;" class="hover:text-aura-500 transition-colors">Support</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
